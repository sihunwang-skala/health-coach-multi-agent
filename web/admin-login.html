<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의료진 로그인</title><meta name="robots" content="noindex"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ds.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:var(--s5) var(--s4)}.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:var(--s5)}
.panel{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}form{display:flex;flex-direction:column;gap:var(--s4)}
.badge{align-self:flex-start;font-size:var(--fs-sm);font-weight:700;color:var(--brand);background:var(--brand-soft);padding:2px var(--s3);border-radius:var(--r-pill)}</style></head><body>
<main class="wrap">
 <header style="display:flex;flex-direction:column;gap:var(--s2)"><span class="badge">의료진 전용</span><h1>의료진 콘솔 로그인</h1>
  <p class="muted small">이용자의 건강 정보를 다루는 화면이에요. 열람 기록이 남습니다.</p></header>
 <section class="card panel"><form id="f" novalidate>
  <div class="field"><label for="u">아이디</label><input class="input" id="u" autocomplete="username" autocapitalize="none" required></div>
  <div class="field"><label for="p">비밀번호</label><input class="input" id="p" type="password" autocomplete="current-password" required></div>
  <p class="error" id="err" role="alert"></p><button class="btn block" id="b" type="submit">로그인</button></form></section>
 <p class="small muted">의료진 계정은 관리자가 따로 만들어 드려요. 이용자 화면은 <a href="/login">여기</a>에서 로그인하세요.</p>
</main>
<script src="/ds.js"></script>
<script>applyTextSize();$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';$('b').disabled=true;
 try{await api('/api/staff/login',{username:$('u').value,password:$('p').value});location.href='/admin'}catch(x){$('err').textContent=x.message;$('p').value='';$('b').disabled=false}}</script>
</body></html>
